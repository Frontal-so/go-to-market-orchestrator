name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Ubuntu 26.04 has no Python 3.9 build, so the oldest supported version runs on 24.04.
          - python: "3.9"
            os: ubuntu-24.04
          - python: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and structure tests
        run: python -m unittest discover -s tests -v

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.332
      - name: Validate the marketplace and every plugin
        run: |
          claude plugin validate --strict .
          for p in plugins/*/; do claude plugin validate --strict "$p"; done
